<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pratta Tech Finance</title>

  <!-- 1. Carrega o Tailwind CSS (Estilos) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 2. Import Map: Resolve o erro "Failed to resolve module specifier" -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0",
        "recharts": "https://esm.sh/recharts@2.12.0?external=react,react-dom"
      }
    }
  </script>

  <!-- 3. Carrega o Babel (Para entender o código React/JSX no navegador) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Estilos extras para barra de rolagem escura -->
  <style>
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    body { background-color: #020617; }
  </style>
</head>
<body>

  <!-- Onde o React vai montar o app -->
  <div id="root"></div>

  <!-- 4. O Código da Aplicação -->
  <script type="text/babel" data-type="module">
    // Agora podemos importar usando os nomes definidos no importmap
    import React, { useState, useMemo, useEffect } from "react";
    import { createRoot } from "react-dom/client";
    
    // Firebase Imports
    import { initializeApp } from "firebase/app";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "firebase/auth";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      deleteDoc, 
      doc, 
      setDoc,
      getDoc,
      onSnapshot, 
      query, 
      orderBy,
      writeBatch
    } from "firebase/firestore";

    // Icons (Lucide)
    import { 
      LayoutDashboard, Wallet, TrendingUp, History, Plus, 
      ArrowUpCircle, ArrowDownCircle, Trash2, PieChart, 
      DollarSign, Calendar, Filter, Briefcase, Target, 
      LogOut, User, Lock, Mail, Loader2, AlertCircle,
      CreditCard, Calculator, X, CheckCircle2, PiggyBank
    } from "lucide-react";

    // Charts (Recharts)
    import { 
      BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, 
      ResponsiveContainer, AreaChart, Area, Cell, 
      PieChart as RePieChart, Pie 
    } from "recharts";

    // --- Configuração do Firebase ---
    const firebaseConfig = {
      apiKey: "AIzaSyBpPnIQMPH1W3JYamqvkwH4WWB3WIbo4AM",
      authDomain: "financas-pessoais-3ea6c.firebaseapp.com",
      projectId: "financas-pessoais-3ea6c",
      storageBucket: "financas-pessoais-3ea6c.firebasestorage.app",
      messagingSenderId: "583092664584",
      appId: "1:583092664584:web:ef267366bc1a1642ced4bd"
    };

    // Inicialização do Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // --- Utilitários ---
    const formatCurrency = (value) => {
      if (typeof value !== 'number') return 'R$ 0,00';
      return new Intl.NumberFormat('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      }).format(value);
    };

    const formatDate = (dateString) => {
      if (!dateString) return '';
      try {
        const date = new Date(dateString + 'T12:00:00'); 
        if (isNaN(date.getTime())) return dateString;
        const options = { day: '2-digit', month: '2-digit', year: 'numeric' };
        return date.toLocaleDateString('pt-BR', options);
      } catch (e) {
        return dateString;
      }
    };

    const CATEGORIES = {
      income: ['Salário', 'Investimentos', 'Extra', 'Outros'],
      expense: ['Moradia', 'Alimentação', 'Consumo Online', 'Transporte', 'Lazer', 'Saúde', 'Educação', 'Contas', 'Outros']
    };

    // --- Componentes ---

    const Card = ({ title, value, icon: Icon, trend, type }) => (
      <div className="bg-slate-800/50 backdrop-blur-xl border border-slate-700/50 p-6 rounded-2xl shadow-lg hover:shadow-cyan-900/20 transition-all duration-300">
        <div className="flex justify-between items-start mb-4">
          <div>
            <p className="text-slate-400 text-sm font-medium mb-1">{title}</p>
            <h3 className={`text-2xl font-bold ${
              type === 'income' ? 'text-emerald-400' : 
              type === 'expense' ? 'text-rose-400' : 
              'text-white'
            }`}>
              {value}
            </h3>
          </div>
          <div className={`p-3 rounded-xl ${
            type === 'income' ? 'bg-emerald-500/10 text-emerald-400' : 
            type === 'expense' ? 'bg-rose-500/10 text-rose-400' : 
            'bg-cyan-500/10 text-cyan-400'
          }`}>
            <Icon size={24} />
          </div>
        </div>
        {trend && (
          <div className="flex items-center text-xs text-slate-400">
            <span className="text-emerald-400 mr-1 flex items-center">
              <TrendingUp size={12} className="mr-1" /> {trend}
            </span>
            vs mês anterior
          </div>
        )}
      </div>
    );

    const Button = ({ children, onClick, variant = 'primary', className = '', disabled, type = 'button', ...props }) => {
      const baseStyle = "px-4 py-2 rounded-xl font-medium transition-all duration-200 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed";
      const variants = {
        primary: "bg-cyan-500 hover:bg-cyan-600 text-white shadow-lg shadow-cyan-500/20",
        secondary: "bg-slate-700 hover:bg-slate-600 text-slate-200",
        danger: "bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20",
        ghost: "hover:bg-slate-800 text-slate-400 hover:text-white"
      };

      return (
        <button 
          onClick={onClick} 
          type={type}
          className={`${baseStyle} ${variants[variant]} ${className}`}
          disabled={disabled}
          {...props}
        >
          {children}
        </button>
      );
    };

    // --- Tela de Login ---
    const LoginScreen = () => {
      const [isRegistering, setIsRegistering] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleAuth = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        
        try {
          if (isRegistering) {
            await createUserWithEmailAndPassword(auth, email, password);
          } else {
            await signInWithEmailAndPassword(auth, email, password);
          }
        } catch (err) {
          let msg = "Ocorreu um erro.";
          if (err.code === 'auth/invalid-email') msg = "E-mail inválido.";
          if (err.code === 'auth/user-not-found') msg = "Usuário não encontrado.";
          if (err.code === 'auth/wrong-password') msg = "Senha incorreta.";
          if (err.code === 'auth/email-already-in-use') msg = "E-mail já cadastrado.";
          if (err.code === 'auth/weak-password') msg = "A senha deve ter pelo menos 6 caracteres.";
          setError(msg);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
          <div className="fixed inset-0 overflow-hidden pointer-events-none">
            <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-cyan-500/10 rounded-full blur-[100px]"></div>
            <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-purple-500/10 rounded-full blur-[100px]"></div>
          </div>

          <div className="bg-slate-900/50 backdrop-blur-xl border border-slate-700/50 p-8 rounded-3xl w-full max-w-md shadow-2xl relative z-10">
            <div className="text-center mb-8">
              <div className="w-16 h-16 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-2xl flex items-center justify-center shadow-lg shadow-cyan-500/20 mx-auto mb-4">
                <span className="font-bold text-white text-3xl">P</span>
              </div>
              <h1 className="text-2xl font-bold text-white mb-2">Pratta Tech Finance</h1>
              <p className="text-slate-400">Gerencie seu futuro financeiro.</p>
            </div>

            {error && (
              <div className="bg-rose-500/10 border border-rose-500/20 text-rose-400 p-3 rounded-xl mb-6 flex items-center gap-2 text-sm">
                <AlertCircle size={16} />
                {error}
              </div>
            )}

            <form onSubmit={handleAuth} className="space-y-4">
              <div className="space-y-2">
                <label className="text-sm font-medium text-slate-300 ml-1">Email</label>
                <div className="relative">
                  <Mail className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" size={18} />
                  <input 
                    type="email" 
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-white focus:outline-none focus:border-cyan-500 transition-colors"
                    placeholder="seu@email.com"
                    required
                  />
                </div>
              </div>
              
              <div className="space-y-2">
                <label className="text-sm font-medium text-slate-300 ml-1">Senha</label>
                <div className="relative">
                  <Lock className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" size={18} />
                  <input 
                    type="password" 
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-white focus:outline-none focus:border-cyan-500 transition-colors"
                    placeholder="••••••••"
                    required
                  />
                </div>
              </div>

              <Button type="submit" className="w-full py-3 mt-2" disabled={loading}>
                {loading ? <Loader2 className="animate-spin" /> : (isRegistering ? 'Criar Conta' : 'Entrar')}
              </Button>
            </form>

            <div className="mt-6 text-center">
              <button 
                onClick={() => setIsRegistering(!isRegistering)}
                className="text-slate-400 hover:text-cyan-400 text-sm transition-colors"
              >
                {isRegistering ? 'Já tem uma conta? Faça login' : 'Não tem conta? Cadastre-se'}
              </button>
            </div>
          </div>
        </div>
      );
    };

    // --- Views Internas ---

    const DashboardView = ({ transactions }) => {
      const [filterMonth, setFilterMonth] = useState(new Date().toISOString().slice(0, 7));

      const summary = useMemo(() => {
        let filteredDocs = transactions;
        if (filterMonth) {
            filteredDocs = transactions.filter(t => t.date.startsWith(filterMonth));
        }
        
        const income = filteredDocs.filter(t => t.type === 'income').reduce((acc, curr) => acc + curr.amount, 0);
        const expense = filteredDocs.filter(t => t.type === 'expense').reduce((acc, curr) => acc + curr.amount, 0);
        const balance = income - expense;

        return { income, expense, balance };
      }, [transactions, filterMonth]);

      const chartData = useMemo(() => {
        const data = {};
        let filteredDocs = transactions;
        if (filterMonth) {
            filteredDocs = transactions.filter(t => t.date.startsWith(filterMonth));
        }

        filteredDocs
          .filter(t => t.type === 'expense')
          .forEach(t => {
            data[t.category] = (data[t.category] || 0) + t.amount;
          });
        return Object.keys(data).map(key => ({ name: key, value: data[key] }));
      }, [transactions, filterMonth]);

      const areaChartData = useMemo(() => {
          const grouped = {};
          
          let filteredDocs = transactions;
          if (filterMonth) {
            filteredDocs = transactions.filter(t => t.date.startsWith(filterMonth));
          }

          const sorted = [...filteredDocs].sort((a,b) => a.date.localeCompare(b.date));
          
          sorted.forEach(t => {
              const date = t.date;
              if (!grouped[date]) grouped[date] = { name: formatDate(date).slice(0,5), entrada: 0, saida: 0, fullDate: date };
              if (t.type === 'income') grouped[date].entrada += t.amount;
              else grouped[date].saida += t.amount;
          });
          
          if (filterMonth) return Object.values(grouped);
          return Object.values(grouped).slice(-7);
      }, [transactions, filterMonth]);

      const COLORS = ['#06b6d4', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981', '#6366f1'];

      return (
        <div className="space-y-6 animate-fadeIn">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-800/30 p-4 rounded-xl border border-slate-700/30">
            <div>
                <h3 className="text-lg font-bold text-white flex items-center gap-2">
                    <LayoutDashboard size={20} className="text-cyan-400" />
                    Visão Geral
                </h3>
                <p className="text-xs text-slate-400">
                    {filterMonth ? `Exibindo dados de ${filterMonth.split('-').reverse().join('/')}` : 'Exibindo visão geral de todo o período'}
                </p>
            </div>
            
            <div className="flex items-center gap-2 bg-slate-900 p-1 rounded-xl border border-slate-700">
                <input 
                    type="month" 
                    value={filterMonth}
                    onChange={(e) => setFilterMonth(e.target.value)}
                    className="bg-transparent text-white text-sm border-none focus:ring-0 p-2 outline-none"
                />
                <button 
                    onClick={() => setFilterMonth('')} 
                    className="p-2 text-slate-400 hover:text-white"
                    title="Ver Todo o Período"
                >
                    <X size={16} />
                </button>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            <Card 
              title={filterMonth ? "Saldo (Período)" : "Saldo Acumulado"} 
              value={formatCurrency(summary.balance)} 
              icon={Wallet} 
              type="balance"
            />
            <Card 
              title={filterMonth ? "Receitas (Filtro)" : "Receitas (Total)"} 
              value={formatCurrency(summary.income)} 
              icon={ArrowUpCircle} 
              type="income"
            />
            <Card 
              title={filterMonth ? "Despesas (Filtro)" : "Despesas (Total)"}
              value={formatCurrency(summary.expense)} 
              icon={ArrowDownCircle} 
              type="expense"
            />
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="bg-slate-800/50 backdrop-blur-xl border border-slate-700/50 p-6 rounded-2xl shadow-lg">
              <h3 className="text-lg font-bold text-white mb-6 flex items-center gap-2">
                <TrendingUp size={20} className="text-cyan-400" />
                Fluxo de Caixa
              </h3>
              <div className="h-64">
                {areaChartData.length > 0 ? (
                    <ResponsiveContainer width="100%" height="100%">
                    <AreaChart data={areaChartData}>
                        <defs>
                        <linearGradient id="colorEntrada" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="5%" stopColor="#10b981" stopOpacity={0.3}/>
                            <stop offset="95%" stopColor="#10b981" stopOpacity={0}/>
                        </linearGradient>
                        <linearGradient id="colorSaida" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="5%" stopColor="#f43f5e" stopOpacity={0.3}/>
                            <stop offset="95%" stopColor="#f43f5e" stopOpacity={0}/>
                        </linearGradient>
                        </defs>
                        <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                        <XAxis dataKey="name" stroke="#94a3b8" fontSize={12} />
                        <YAxis stroke="#94a3b8" fontSize={12} />
                        <Tooltip 
                        contentStyle={{ backgroundColor: '#1e293b', borderColor: '#334155', borderRadius: '8px', color: '#fff' }}
                        />
                        <Area type="monotone" dataKey="entrada" stroke="#10b981" fillOpacity={1} fill="url(#colorEntrada)" />
                        <Area type="monotone" dataKey="saida" stroke="#f43f5e" fillOpacity={1} fill="url(#colorSaida)" />
                    </AreaChart>
                    </ResponsiveContainer>
                ) : (
                    <div className="h-full flex items-center justify-center text-slate-500">
                        Sem dados neste período
                    </div>
                )}
              </div>
            </div>

            <div className="bg-slate-800/50 backdrop-blur-xl border border-slate-700/50 p-6 rounded-2xl shadow-lg">
              <h3 className="text-lg font-bold text-white mb-6 flex items-center gap-2">
                <PieChart size={20} className="text-purple-400" />
                Despesas por Categoria
              </h3>
              <div className="h-64 flex items-center justify-center">
                {chartData.length > 0 ? (
                    <ResponsiveContainer width="100%" height="100%">
                    <RePieChart>
                        <Pie
                        data={chartData}
                        cx="50%"
                        cy="50%"
                        innerRadius={60}
                        outerRadius={80}
                        paddingAngle={5}
                        dataKey="value"
                        >
                        {chartData.map((entry, index) => (
                            <Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />
                        ))}
                        </Pie>
                        <Tooltip contentStyle={{ backgroundColor: '#1e293b', borderColor: '#334155', borderRadius: '8px' }} />
                    </RePieChart>
                    </ResponsiveContainer>
                ) : (
                    <div className="text-slate-500">Sem despesas neste período</div>
                )}
              </div>
              <div className="flex flex-wrap justify-center gap-3 mt-4">
                {chartData.slice(0, 5).map((entry, index) => (
                  <div key={index} className="flex items-center gap-1 text-xs text-slate-400">
                    <div className="w-2 h-2 rounded-full" style={{ backgroundColor: COLORS[index % COLORS.length] }}></div>
                    {entry.name}
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    };

    const TransactionsView = ({ transactions, onAdd, onDelete, loadingOp }) => {
      const [filterMonth, setFilterMonth] = useState(new Date().toISOString().slice(0, 7)); // YYYY-MM
      
      const [formData, setFormData] = useState({
        description: '',
        amount: '',
        type: 'expense',
        category: '',
        date: new Date().toISOString().split('T')[0],
        isInstallment: false,
        totalInstallments: 12,
        currentInstallment: 1
      });

      useEffect(() => {
        if (!formData.category || !CATEGORIES[formData.type].includes(formData.category)) {
            setFormData(prev => ({ ...prev, category: CATEGORIES[prev.type][0] }));
        }
      }, [formData.type]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!formData.description || !formData.amount) return;

        if (formData.isInstallment && formData.type === 'expense') {
            const total = parseInt(formData.totalInstallments);
            const start = parseInt(formData.currentInstallment);
            const totalValue = parseFloat(formData.amount);
            const installmentValue = totalValue / total;
            const baseDate = new Date(formData.date);
            const transactionsToAdd = [];

            for (let i = 0; i < (total - start + 1); i++) {
                const currentNum = start + i;
                const parcelDate = new Date(baseDate.getFullYear(), baseDate.getMonth() + i, baseDate.getDate() + 1); 
                const dateString = parcelDate.toISOString().split('T')[0];

                transactionsToAdd.push({
                    description: `${formData.description} (${currentNum}/${total})`,
                    amount: installmentValue,
                    type: 'expense',
                    category: formData.category,
                    date: dateString
                });
            }

            for (const t of transactionsToAdd) {
                await onAdd(t);
            }

        } else {
            await onAdd({
                description: formData.description,
                amount: parseFloat(formData.amount),
                type: formData.type,
                category: formData.category,
                date: formData.date
            });
        }
        
        setFormData({ 
            ...formData, 
            description: '', 
            amount: '', 
            isInstallment: false,
            totalInstallments: 12,
            currentInstallment: 1
        });
      };

      const filteredTransactions = transactions.filter(t => {
          if (!filterMonth) return true;
          return t.date.startsWith(filterMonth);
      }).sort((a,b) => new Date(b.date) - new Date(a.date));

      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-fadeIn">
          <div className="lg:col-span-1">
            <div className="bg-slate-800/50 backdrop-blur-xl border border-slate-700/50 p-6 rounded-2xl sticky top-6">
              <h3 className="text-xl font-bold text-white mb-6 flex items-center gap-2">
                <Plus size={20} className="text-cyan-400" />
                Nova Transação
              </h3>
              <form onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block text-sm text-slate-400 mb-1">Descrição</label>
                  <input 
                    type="text" 
                    value={formData.description}
                    onChange={(e) => setFormData({...formData, description: e.target.value})}
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500 transition-colors"
                    placeholder="Ex: Compra Online"
                    required
                  />
                </div>
                
                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-sm text-slate-400 mb-1">Valor Total</label>
                    <input 
                      type="number" 
                      step="0.01"
                      value={formData.amount}
                      onChange={(e) => setFormData({...formData, amount: e.target.value})}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500"
                      placeholder="0,00"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-sm text-slate-400 mb-1">Data</label>
                    <input 
                      type="date" 
                      value={formData.date}
                      onChange={(e) => setFormData({...formData, date: e.target.value})}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500"
                      required
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-sm text-slate-400 mb-1">Tipo</label>
                  <div className="grid grid-cols-2 gap-2 bg-slate-900 p-1 rounded-xl">
                    <button
                      type="button"
                      onClick={() => setFormData({...formData, type: 'income', isInstallment: false})}
                      className={`p-2 rounded-lg text-sm font-medium transition-all ${
                        formData.type === 'income' ? 'bg-emerald-500/20 text-emerald-400 shadow-sm' : 'text-slate-500 hover:text-slate-300'
                      }`}
                    >
                      Entrada
                    </button>
                    <button
                      type="button"
                      onClick={() => setFormData({...formData, type: 'expense'})}
                      className={`p-2 rounded-lg text-sm font-medium transition-all ${
                        formData.type === 'expense' ? 'bg-rose-500/20 text-rose-400 shadow-sm' : 'text-slate-500 hover:text-slate-300'
                      }`}
                    >
                      Saída
                    </button>
                  </div>
                </div>

                {formData.type === 'expense' && (
                    <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
                        <div className="flex items-center gap-2 mb-2">
                            <input 
                                type="checkbox" 
                                id="isInstallment"
                                checked={formData.isInstallment}
                                onChange={(e) => setFormData({...formData, isInstallment: e.target.checked})}
                                className="w-4 h-4 rounded border-slate-600 text-cyan-500 focus:ring-cyan-500 bg-slate-800"
                            />
                            <label htmlFor="isInstallment" className="text-sm text-slate-300 select-none cursor-pointer flex items-center gap-1">
                                <CreditCard size={14} /> Parcelar Compra?
                            </label>
                        </div>

                        {formData.isInstallment && (
                            <div className="grid grid-cols-2 gap-3 animate-fadeIn">
                                <div>
                                    <label className="block text-xs text-slate-400 mb-1">Qtd Parcelas</label>
                                    <input 
                                        type="number" 
                                        min="2"
                                        value={formData.totalInstallments}
                                        onChange={(e) => setFormData({...formData, totalInstallments: e.target.value})}
                                        className="w-full bg-slate-800 border border-slate-600 rounded-lg p-2 text-white text-sm"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs text-slate-400 mb-1">Parcela Atual</label>
                                    <input 
                                        type="number" 
                                        min="1"
                                        max={formData.totalInstallments}
                                        value={formData.currentInstallment}
                                        onChange={(e) => setFormData({...formData, currentInstallment: e.target.value})}
                                        className="w-full bg-slate-800 border border-slate-600 rounded-lg p-2 text-white text-sm"
                                    />
                                </div>
                                <div className="col-span-2 text-xs text-cyan-400 flex items-center gap-1 bg-cyan-900/10 p-2 rounded">
                                    <Calculator size={12} />
                                    Serão criadas {formData.totalInstallments - formData.currentInstallment + 1} transações de {formatCurrency(formData.amount / formData.totalInstallments)}
                                </div>
                            </div>
                        )}
                    </div>
                )}

                <div>
                  <label className="block text-sm text-slate-400 mb-1">Categoria</label>
                  <select 
                    value={formData.category}
                    onChange={(e) => setFormData({...formData, category: e.target.value})}
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500"
                  >
                    {CATEGORIES[formData.type].map(cat => (
                      <option key={cat} value={cat}>{cat}</option>
                    ))}
                  </select>
                </div>

                <Button type="submit" className="w-full mt-4" disabled={loadingOp}>
                  {loadingOp ? <Loader2 className="animate-spin" size={20}/> : (formData.isInstallment ? 'Gerar Parcelas' : 'Adicionar Lançamento')}
                </Button>
              </form>
            </div>
          </div>

          <div className="lg:col-span-2 space-y-4">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-4">
              <h3 className="text-xl font-bold text-white">Lançamentos</h3>
              
              <div className="flex items-center gap-2 bg-slate-800 p-1 rounded-xl border border-slate-700">
                <input 
                    type="month" 
                    value={filterMonth}
                    onChange={(e) => setFilterMonth(e.target.value)}
                    className="bg-transparent text-white text-sm border-none focus:ring-0 p-2 outline-none"
                />
                <button 
                    onClick={() => setFilterMonth('')} 
                    className="p-2 text-slate-400 hover:text-white"
                    title="Limpar Filtro"
                >
                    <X size={16} />
                </button>
              </div>
            </div>

            {filteredTransactions.length === 0 ? (
              <div className="text-center py-12 text-slate-500 bg-slate-800/30 rounded-2xl border border-slate-700/30 border-dashed">
                Nenhuma transação encontrada neste período. <br/> 
              </div>
            ) : (
                <div className="space-y-2">
                  {filteredTransactions.map((t) => (
                    <div key={t.id} className="group bg-slate-800/30 border border-slate-700/30 p-4 rounded-xl flex items-center justify-between hover:bg-slate-800/60 transition-all">
                        <div className="flex items-center gap-4">
                        <div className={`w-10 h-10 rounded-full flex items-center justify-center ${
                            t.type === 'income' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'
                        }`}>
                            {t.type === 'income' ? <ArrowUpCircle size={20} /> : <ArrowDownCircle size={20} />}
                        </div>
                        <div>
                            <p className="font-semibold text-white">{t.description}</p>
                            <div className="flex gap-2 text-xs text-slate-400 mt-1">
                            <span className="flex items-center gap-1"><Calendar size={10} /> {formatDate(t.date)}</span>
                            <span className="bg-slate-700/50 px-2 rounded text-slate-300">{t.category}</span>
                            </div>
                        </div>
                        </div>
                        <div className="flex items-center gap-4">
                        <span className={`font-bold ${
                            t.type === 'income' ? 'text-emerald-400' : 'text-rose-400'
                        }`}>
                            {t.type === 'expense' ? '-' : '+'} {formatCurrency(t.amount)}
                        </span>
                        <button 
                            onClick={() => onDelete(t.id)}
                            className="opacity-0 group-hover:opacity-100 p-2 text-slate-500 hover:text-rose-400 transition-all"
                        >
                            <Trash2 size={16} />
                        </button>
                        </div>
                    </div>
                  ))}
                </div>
            )}
          </div>
        </div>
      );
    };

    const TimelineView = ({ transactions }) => {
      // Ordena por data (mais recente primeiro) e garante que transactions não é nulo
      const sortedTransactions = useMemo(() => {
        if (!transactions || !Array.isArray(transactions)) return [];
        return [...transactions].sort((a, b) => new Date(b.date) - new Date(a.date));
      }, [transactions]);

      return (
        <div className="max-w-3xl mx-auto animate-fadeIn">
          <h2 className="text-2xl font-bold text-white mb-8 pl-4">Linha do Tempo</h2>
          {sortedTransactions.length === 0 ? (
              <div className="text-slate-500 pl-4">Nenhum evento registrado.</div>
          ) : (
          <div className="relative border-l-2 border-slate-700 ml-4 space-y-8 pb-8">
            {sortedTransactions.map((t, index) => (
              <div key={t.id || index} className="relative pl-8">
                {/* Ajuste de centralização do ponto: -left-[7px] para alinhar no centro da borda de 2px */}
                <div className={`absolute -left-[7px] top-0 w-4 h-4 rounded-full border-2 ${
                  t.type === 'income' ? 'bg-emerald-500 border-emerald-900' : 'bg-rose-500 border-rose-900'
                }`}></div>
                
                <div className="bg-slate-800/50 border border-slate-700 p-4 rounded-xl hover:border-cyan-500/30 transition-colors">
                  <div className="flex justify-between items-start">
                    <div>
                      <span className="text-xs text-slate-400 bg-slate-900 px-2 py-1 rounded-md mb-2 inline-block">
                        {formatDate(t.date)}
                      </span>
                      <h4 className="text-white font-medium text-lg">{t.description}</h4>
                      <p className="text-sm text-slate-400">{t.category}</p>
                    </div>
                    <span className={`font-bold text-lg ${
                      t.type === 'income' ? 'text-emerald-400' : 'text-rose-400'
                    }`}>
                      {t.type === 'expense' ? '-' : '+'} {formatCurrency(t.amount)}
                    </span>
                  </div>
                </div>
              </div>
            ))}
          </div>
          )}
        </div>
      );
    };

    const InvestmentsView = ({ user }) => {
      const [hasInvestments, setHasInvestments] = useState(false);
      const [challengeSelection, setChallengeSelection] = useState([]);
      const [savingLoading, setSavingLoading] = useState(false);

      // Sequência para o desafio (1..175..1)
      const SEQUENCE = useMemo(() => {
        const up = Array.from({length: 175}, (_, i) => i + 1);
        const down = [...up].reverse();
        return [...up, ...down];
      }, []);

      // Total possível
      const TOTAL_CHALLENGE = useMemo(() => SEQUENCE.reduce((a, b) => a + b, 0), [SEQUENCE]);

      // Carregar dados do desafio
      useEffect(() => {
        if (!user) return;
        const fetchChallenge = async () => {
            const docRef = doc(db, 'users', user.uid, 'challenges', 'saving_175');
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                setChallengeSelection(docSnap.data().selected || []);
            }
        };
        fetchChallenge();
      }, [user]);

      const toggleNumber = async (index) => {
        if (!user) return;
        const newSelection = challengeSelection.includes(index) 
            ? challengeSelection.filter(i => i !== index)
            : [...challengeSelection, index];
        
        setChallengeSelection(newSelection);
        
        // Salvar no Firebase (Debounce ou direto)
        try {
            await setDoc(doc(db, 'users', user.uid, 'challenges', 'saving_175'), {
                selected: newSelection
            }, { merge: true });
        } catch (e) {
            console.error("Erro ao salvar desafio", e);
        }
      };

      const currentSaved = useMemo(() => {
        return challengeSelection.reduce((acc, index) => acc + SEQUENCE[index], 0);
      }, [challengeSelection, SEQUENCE]);

      if (!hasInvestments) {
        return (
          <div className="flex flex-col items-center justify-center min-h-[60vh] text-center animate-fadeIn space-y-12">
            <div className="bg-slate-800/50 backdrop-blur-xl border border-slate-700/50 p-12 rounded-3xl max-w-2xl shadow-2xl relative overflow-hidden">
              <div className="absolute top-0 right-0 w-64 h-64 bg-cyan-500/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"></div>
              <div className="absolute bottom-0 left-0 w-64 h-64 bg-purple-500/10 rounded-full blur-3xl translate-y-1/2 -translate-x-1/2"></div>
              
              <div className="relative z-10">
                <div className="w-20 h-20 bg-slate-900 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-xl border border-slate-700">
                  <Target size={40} className="text-cyan-400" />
                </div>
                
                <h2 className="text-3xl font-bold text-white mb-4">Comece sua Jornada Investidora</h2>
                <p className="text-slate-400 mb-8 max-w-md mx-auto">
                  Você ainda não possui investimentos cadastrados. O Pratta Tech Finance ajuda você a planejar e acompanhar a evolução do seu patrimônio.
                </p>
                <Button onClick={() => setHasInvestments(true)} className="w-full md:w-auto px-8 py-3 text-lg shadow-cyan-500/25">
                  Criar meu Primeiro Investimento
                </Button>
              </div>
            </div>

            {/* Seção do Desafio (Sempre visível ou parte da intro) */}
            <div className="w-full max-w-5xl">
                <div className="flex flex-col md:flex-row justify-between items-end mb-6 gap-4">
                    <div className="text-left">
                        <h3 className="text-2xl font-bold text-white flex items-center gap-2">
                            <PiggyBank className="text-emerald-400" /> Desafio de Poupança (R$ 30.800)
                        </h3>
                        <p className="text-slate-400 text-sm mt-1">
                            Guarde a quantia correspondente a cada número. Marque quando guardar.
                        </p>
                    </div>
                    <div className="bg-slate-800 p-3 rounded-xl border border-slate-700 text-right">
                        <span className="text-xs text-slate-400 block">Total Acumulado</span>
                        <span className="text-2xl font-bold text-emerald-400">{formatCurrency(currentSaved)}</span>
                    </div>
                </div>

                <div className="bg-slate-900/50 border border-slate-800 p-6 rounded-2xl overflow-hidden">
                    <div className="grid grid-cols-5 sm:grid-cols-8 md:grid-cols-10 lg:grid-cols-14 gap-2">
                        {SEQUENCE.map((val, idx) => {
                            const isSelected = challengeSelection.includes(idx);
                            return (
                                <button
                                    key={idx}
                                    onClick={() => toggleNumber(idx)}
                                    className={`
                                        h-10 rounded-lg text-xs font-bold transition-all duration-200 flex items-center justify-center relative
                                        ${isSelected 
                                            ? 'bg-emerald-500 text-white shadow-[0_0_10px_rgba(16,185,129,0.4)] scale-105 z-10' 
                                            : 'bg-slate-800 text-slate-500 hover:bg-slate-700 hover:text-slate-300'
                                        }
                                    `}
                                >
                                    {isSelected && <CheckCircle2 size={12} className="absolute -top-1 -right-1 text-white bg-emerald-600 rounded-full" />}
                                    R$ {val}
                                </button>
                            )
                        })}
                    </div>
                </div>
            </div>
          </div>
        );
      }

      // Visão de Carteira Completa (Placeholder + Desafio)
      return (
        <div className="animate-fadeIn space-y-8">
          <div className="flex justify-between items-center">
            <h2 className="text-2xl font-bold text-white">Minha Carteira</h2>
            <Button onClick={() => setHasInvestments(false)} variant="secondary" className="text-sm">
              Voltar
            </Button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div className="bg-slate-800/50 backdrop-blur-xl border border-slate-700/50 p-6 rounded-2xl md:col-span-2">
                <div className="flex items-center justify-between mb-6">
                    <h3 className="font-bold text-white">Patrimônio Total</h3>
                    <span className="text-2xl font-bold text-emerald-400">R$ {formatCurrency(currentSaved)}</span>
                </div>
                <div className="h-64 flex flex-col items-center justify-center text-slate-500 border-2 border-dashed border-slate-700 rounded-xl bg-slate-900/30">
                    <Plus size={32} className="mb-2 opacity-50" />
                    <p>Adicione ativos para ver o gráfico de evolução</p>
                </div>
            </div>

            <div className="bg-slate-800/50 backdrop-blur-xl border border-slate-700/50 p-6 rounded-2xl">
                <h3 className="font-bold text-white mb-4">Adicionar Ativo</h3>
                <form className="space-y-3">
                    <input className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white text-sm" placeholder="Nome (ex: Tesouro Selic)" />
                    <select className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white text-sm">
                        <option>Renda Fixa</option>
                        <option>Ações</option>
                        <option>FIIs</option>
                        <option>Cripto</option>
                    </select>
                    <input className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white text-sm" placeholder="Valor Investido" type="number" />
                    <Button className="w-full mt-2">Confirmar</Button>
                </form>
            </div>
          </div>

          {/* Desafio dentro da visão de carteira também */}
          <div className="border-t border-slate-800 pt-8">
             <div className="flex justify-between items-center mb-6">
                <h3 className="text-xl font-bold text-white flex items-center gap-2">
                    <PiggyBank className="text-emerald-400" /> Desafio de Poupança
                </h3>
                <span className="text-emerald-400 font-bold bg-emerald-500/10 px-3 py-1 rounded-lg">
                    {formatCurrency(currentSaved)} acumulados
                </span>
             </div>
             
             <div className="bg-slate-900/50 border border-slate-800 p-6 rounded-2xl overflow-hidden max-h-[400px] overflow-y-auto">
                <div className="grid grid-cols-5 sm:grid-cols-10 md:grid-cols-12 lg:grid-cols-16 gap-2">
                    {SEQUENCE.map((val, idx) => {
                        const isSelected = challengeSelection.includes(idx);
                        return (
                            <button
                                key={idx}
                                onClick={() => toggleNumber(idx)}
                                className={`
                                    h-8 rounded text-[10px] font-bold transition-all duration-200 flex items-center justify-center
                                    ${isSelected 
                                        ? 'bg-emerald-500 text-white' 
                                        : 'bg-slate-800 text-slate-500 hover:bg-slate-700'
                                    }
                                `}
                            >
                                {val}
                            </button>
                        )
                    })}
                </div>
             </div>
          </div>
        </div>
      );
    };

    const App = () => {
      const [user, setUser] = useState(null);
      const [loadingAuth, setLoadingAuth] = useState(true);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [transactions, setTransactions] = useState([]);
      const [loadingOp, setLoadingOp] = useState(false);

      useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
          setLoadingAuth(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) {
            setTransactions([]);
            return;
        }

        const q = query(
            collection(db, 'users', user.uid, 'transactions'),
            orderBy('date', 'desc')
        );

        const unsubscribe = onSnapshot(q, (querySnapshot) => {
            const docs = [];
            querySnapshot.forEach((doc) => {
                docs.push({ id: doc.id, ...doc.data() });
            });
            setTransactions(docs);
        });

        return () => unsubscribe();
      }, [user]);

      const handleAddTransaction = async (newTransaction) => {
        if(!user) return;
        setLoadingOp(true);
        try {
            const { id, ...data } = newTransaction; 
            await addDoc(collection(db, 'users', user.uid, 'transactions'), data);
        } catch (error) {
            console.error("Erro ao adicionar:", error);
            alert("Erro ao salvar transação");
        } finally {
            setLoadingOp(false);
        }
      };

      const handleDeleteTransaction = async (id) => {
        if(!user) return;
        try {
            await deleteDoc(doc(db, 'users', user.uid, 'transactions', id));
        } catch (error) {
            console.error("Erro ao deletar:", error);
        }
      };

      const handleLogout = async () => {
        await signOut(auth);
      };

      if (loadingAuth) {
        return (
            <div className="min-h-screen bg-slate-950 flex items-center justify-center">
                <Loader2 className="animate-spin text-cyan-500" size={48} />
            </div>
        )
      }

      if (!user) {
        return <LoginScreen />;
      }

      const menuItems = [
        { id: 'dashboard', label: 'Dashboard', icon: LayoutDashboard },
        { id: 'transactions', label: 'Transações', icon: DollarSign },
        { id: 'investments', label: 'Investimentos', icon: TrendingUp },
        { id: 'timeline', label: 'Linha do Tempo', icon: History },
      ];

      return (
        <div className="min-h-screen bg-slate-950 text-slate-200 font-sans selection:bg-cyan-500/30 flex">
          <aside className="hidden md:flex flex-col w-64 bg-slate-900 border-r border-slate-800 fixed h-full z-20">
            <div className="p-6 border-b border-slate-800/50">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-lg flex items-center justify-center shadow-lg shadow-cyan-500/20">
                  <span className="font-bold text-white">P</span>
                </div>
                <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">
                  Pratta Tech
                </h1>
              </div>
              <p className="text-xs text-slate-500 mt-1 ml-10">Finance Manager</p>
            </div>

            <nav className="flex-1 p-4 space-y-2 mt-4">
              {menuItems.map((item) => {
                const Icon = item.icon;
                const isActive = activeTab === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 group ${
                      isActive 
                        ? 'bg-gradient-to-r from-cyan-500/10 to-transparent text-cyan-400 border-l-2 border-cyan-500' 
                        : 'text-slate-400 hover:bg-slate-800 hover:text-white'
                    }`}
                  >
                    <Icon size={20} className={isActive ? 'text-cyan-400' : 'text-slate-500 group-hover:text-white'} />
                    <span className="font-medium">{item.label}</span>
                  </button>
                );
              })}
            </nav>

            <div className="p-4 border-t border-slate-800">
              <div className="bg-slate-800/50 rounded-xl p-4 flex items-center justify-between gap-3">
                <div className="flex items-center gap-3 overflow-hidden">
                    <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500 flex-shrink-0 flex items-center justify-center text-white font-bold">
                    <User size={18} />
                    </div>
                    <div className="min-w-0">
                    <p className="text-sm font-medium text-white truncate">{user.email.split('@')[0]}</p>
                    <p className="text-xs text-slate-400 truncate">Free Plan</p>
                    </div>
                </div>
                <button onClick={handleLogout} className="text-slate-500 hover:text-rose-400 transition-colors" title="Sair">
                    <LogOut size={18} />
                </button>
              </div>
            </div>
          </aside>

          <div className="md:hidden fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 z-50 px-4 py-3 flex justify-between items-center">
            {menuItems.map((item) => {
              const Icon = item.icon;
              const isActive = activeTab === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`flex flex-col items-center gap-1 ${isActive ? 'text-cyan-400' : 'text-slate-500'}`}
                >
                  <Icon size={20} />
                  <span className="text-[10px]">{item.label}</span>
                </button>
              )
            })}
            <button onClick={handleLogout} className="flex flex-col items-center gap-1 text-rose-500/70">
                <LogOut size={20} />
                <span className="text-[10px]">Sair</span>
            </button>
          </div>

          <main className="flex-1 md:ml-64 p-4 md:p-8 overflow-y-auto pb-24 md:pb-8 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">
            <header className="flex justify-between items-center mb-8">
              <div>
                <h2 className="text-2xl font-bold text-white">{menuItems.find(i => i.id === activeTab)?.label}</h2>
                <p className="text-slate-400 text-sm">Painel de {user.email}</p>
              </div>
              <button className="bg-slate-800 p-2 rounded-full text-slate-400 hover:text-white hover:bg-slate-700 transition-all">
                <Filter size={20} />
              </button>
            </header>

            {activeTab === 'dashboard' && <DashboardView transactions={transactions} />}
            {activeTab === 'transactions' && (
              <TransactionsView 
                transactions={transactions} 
                onAdd={handleAddTransaction}
                onDelete={handleDeleteTransaction}
                loadingOp={loadingOp}
              />
            )}
            {activeTab === 'investments' && <InvestmentsView user={user} />}
            {activeTab === 'timeline' && <TimelineView transactions={transactions} />}
          </main>
        </div>
      );
    };

    // Renderização
    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
